<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rocket Dodge — Live Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <div class="title-group">
        <h1>ROCKET DODGE</h1>
        <span class="badge">Java OOP → Web Demo</span>
      </div>
      <div class="actions">
        <button id="muteBtn" class="btn" type="button" aria-pressed="false">🔊 Sound: ON</button>
        <a class="btn btn-secondary" href="https://github.com/faridahmadnr/PBO" target="_blank" rel="noopener noreferrer">GitHub Repo</a>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="gameCanvas" width="800" height="600" tabindex="0" aria-label="Rocket Dodge Game Canvas"></canvas>
    </div>

    <footer class="controls-bar">
      <div class="control-pill"><strong>Player 1:</strong> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div>
      <div class="control-pill"><strong>Player 2:</strong> <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd></div>
      <div class="control-pill"><strong>Start:</strong> <kbd>Space</kbd> / Click</div>
      <div class="control-pill"><strong>Menu:</strong> <kbd>Enter</kbd> / Click</div>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
